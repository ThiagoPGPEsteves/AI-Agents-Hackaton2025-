analyst_task:
  description: >
    Analise o seguinte incidente de segurança reportado pelo sistema de monitoramento:
    - ID do Incidente: {incident_id}
    - IP de Origem: {source_ip}
    - Tipo de Ataque: {attack_type}
    - Severidade Heurística: {heuristic_severity}
    - Amostras de Log:
    {samples_text}

    Avalie se o evento representa um ataque real ou falso positivo.
    Determine a severidade final (LOW, MEDIUM, HIGH ou CRITICAL), mapeie a técnica MITRE ATT&CK
    e categoria OWASP correspondente, e apresente sua justificativa técnica sucinta.
  expected_output: >
    Instância validada do modelo ThreatAssessment contendo incident_id, severity, confidence,
    mitre_technique, owasp_category, false_positive e rationale.
  agent: analyst_agent

responder_task:
  description: >
    Com base na avaliação técnica do analista sobre o incidente {incident_id}, defina o plano
    de resposta a incidentes. Selecione as ações necessárias entre ['block_ip', 'notify', 'audit_only']
    e elabore um resumo conciso das contramedidas tomadas.
  expected_output: >
    Instância validada do modelo ResponsePlan contendo incident_id, actions e summary.
  agent: responder_agent